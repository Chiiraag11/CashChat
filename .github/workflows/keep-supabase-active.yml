
name: Keep Supabase Active

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  keep-active:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check Supabase database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"

          echo "Supabase database query successful"
